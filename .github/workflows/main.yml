name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: greenenergy
  ACR_LOGIN_SERVER: greenenergy.azurecr.io
  RESOURCE_GROUP: Green_Energy
  CONTAINER_APP_NAME: greenenergy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Azure Login
      # =========================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # =========================
      # Verify Azure
      # =========================

      - name: Verify Azure account
        run: |
          echo "Azure account:"
          az account show \
            --query "{subscription:id, name:name, tenant:tenantId}" \
            -o table

      - name: Verify Container App
        run: |
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            -o table

      # =========================
      # Login to ACR
      # =========================

      - name: Login to Container Registry
        run: az acr login --name "$ACR_NAME"

      # =========================
      # Backend
      # =========================

      - name: Build backend image
        run: |
          docker build \
            -f docker/php/Dockerfile.prod \
            -t "$ACR_LOGIN_SERVER/greenenergy-backend:${{ github.sha }}" \
            .

      - name: Push backend image
        run: |
          docker push "$ACR_LOGIN_SERVER/greenenergy-backend:${{ github.sha }}"

      # =========================
      # Frontend
      # =========================

      - name: Build frontend image
        run: |
          docker build \
            -f docker/frontend/Dockerfile.prod \
            -t "$ACR_LOGIN_SERVER/greenenergy-frontend:${{ github.sha }}" \
            .

      - name: Push frontend image
        run: |
          docker push "$ACR_LOGIN_SERVER/greenenergy-frontend:${{ github.sha }}"

      # =========================
      # Deploy Frontend
      # =========================

      - name: Deploy frontend to Azure Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/greenenergy-frontend:${{ github.sha }}"